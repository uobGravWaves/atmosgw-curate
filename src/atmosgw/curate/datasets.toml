# Where each dataset lives, relative to the data root (data_dir).
#
# These are the defaults. Do not edit this file to suit your own computer: it
# is replaced whenever the package is updated. Instead, override any entry in
# your own settings file (~/.config/atmosgw/config.toml, or the file named by
# ATMOSGW_CONFIG), under the same headings, e.g.
#
#     [datasets.SABER]
#     raw = "E:/big_disk/saber"     # absolute path: used as it is
#     pws = "SABER_v2/pws"          # relative path: taken as under data_dir
#
# Look entries up with atmosgw.curate.paths.dataset_dir(name, kind).
#
# Kinds:
#   raw  the instrument's data files, as distributed or lightly reformatted
#   pws  planetary-wave-filtered data ("Hindley23" format, made by the group's
#        MATLAB code)

[datasets.ACE]
raw = "ACE/raw"
pws = "ACE/pws"

[datasets.Aeolus]
raw = "Aeolus/netCDF/Aeolus_L2B_monthly_flat_nc"

[datasets.ALOMAR]
raw = "lidar/ALOMAR"

[datasets.DWD-sondes]
raw = "sondes"

[datasets.GNSS]
raw = "GNSS/raw"
pws = "GNSS/pws"

[datasets.HIRDLS]
raw = "HIRDLS/raw"
pws = "HIRDLS/pws"

[datasets.LIMS]
raw = "LIMS"

[datasets.MIPAS]
raw = "MIPAS/raw"
pws = "MIPAS/pws"

[datasets.MLS]
raw = "MLS/raw"
pws = "MLS/pws"

[datasets.ROMEX]
raw = "GNSS/ROMEX"

[datasets.SABER]
raw = "SABER/raw"
pws = "SABER/pws"

[datasets.SOFIE]
raw = "SOFIE/raw"
pws = "SOFIE/pws"

[datasets.AIRS]
raw = "AIRS/3d_airs"
"2d" = "AIRS/2d_airs"

[datasets.IASI]
raw = "IASI"
