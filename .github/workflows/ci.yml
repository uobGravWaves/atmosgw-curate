name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Exact versions from uv.lock: the same environment as on the maintainers'
  # machines. Fails if uv.lock is out of date with pyproject.toml.
  locked:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: pip install uv
      - name: Install (locked)
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}
      - name: Lint
        run: uv run --locked --extra dev ruff check .
      - name: Test
        run: uv run --locked --extra dev pytest

  # Newest releases allowed by pyproject.toml: catches breakage from new
  # versions of dependencies before it reaches users.
  latest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (latest)
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
