[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atmosgw-curate"
version = "0.3.1"
description = "AtmosGW Curate: loading, standardising and analysing atmospheric gravity-wave observations"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
# 3.11: needed by mat-io (MATLAB file reader); Python 3.10 ended in October 2026
requires-python = ">=3.11"
authors = [{ name = "Corwin J. Wright" }]
keywords = ["atmospheric gravity waves", "remote sensing", "middle atmosphere", "satellite"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "numpy>=1.24",
    # 2025.1.2 is the first xarray with non-nanosecond datetime64 support;
    # the package stores times as datetime64[us].
    "xarray>=2025.1.2",
    # interpolation methods in matlab_compat.interp1 (1.13 is the first with
    # makima) and reading MATLAB .mat test files
    "scipy>=1.13",
    # MATLAB .mat files of every version, including v7.3 and MATLAB tables
    # (ACE, GNSS, PW, sampler and other MATLAB-written instrument files)
    "mat-io>=1.0",
    # HDF5 instrument files (HIRDLS, MLS, ALOMAR)
    "h5py>=3.8",
    # netCDF instrument files (SABER, MIPAS, SOFIE)
    "netcdf4>=1.6",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.urls]
Repository = "https://github.com/uobGravWaves/atmosgw-curate"
Issues = "https://github.com/uobGravWaves/atmosgw-curate/issues"

# atmosgw is a PEP 420 namespace package shared with atmosgw-fuse and later
# family members. Only the atmosgw/curate subpackage belongs to this
# distribution: never add src/atmosgw/__init__.py.
[tool.hatch.build.targets.wheel]
packages = ["src/atmosgw"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, N pep8-naming (the agreed PEP 8 naming rule)
select = ["E", "W", "F", "I", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
